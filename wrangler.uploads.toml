# OPTIONAL UPGRADE: copy the deployed Worker name and actual D1 identifiers first.
# Keep existing CHAT_ROOM and PASSWORD_HASHER bindings and migrations. See docs/UPLOADS.md.
name = "extb"
main = "src/index.ts"
compatibility_date = "2026-10-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "extb-community"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "PASSWORD_HASHER"
class_name = "PasswordHasher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom", "PasswordHasher"]

[vars]
BUILD_ID = "extb-v1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "extb-uploads"
